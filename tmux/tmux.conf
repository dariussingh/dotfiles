##### --- Reload Config --- #####
unbind r
bind r source-file ~/.tmux/tmux.conf \; display-message "Config reloaded!"

##### --- Terminal Settings --- #####
set -g default-terminal "xterm-256color"
set -as terminal-overrides ',xterm-256color:RGB'

##### --- Mouse Support --- #####
set -g mouse on

##### --- Vi Mode --- #####
set-window-option -g mode-keys vi
set-option -g mode-keys vi

##### --- Window Navigation --- #####
bind-key -n M-h previous-window
bind-key -n M-j previous-window
bind-key -n M-l next-window
bind-key -n M-k next-window

##### --- Vim-aware Pane Navigation --- #####
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ]* +(n?vim|vimx?)$'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

##### --- Pane Resize --- #####
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D 5

##### --- Pane Zoom --- #####
bind Enter resize-pane -Z

##### --- Pane Border Lines --- #####
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-active-border-style "fg=red,bold"
set -g pane-border-format "#{?pane_active, Where your fear is - there your task is! ,}"

##### --- GitHub Dark Status Bar --- #####
set -g status-style "bg=#161b22,fg=#c9d1d9"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[bg=#3fb950,fg=#0d1117,bold] #S #[bg=#161b22,fg=#8b949e,nobold]│"
set -g status-right "#[fg=#8b949e]%Y-%m-%d #[fg=#30363d]│ #[fg=#c9d1d9]%H:%M "
set -g window-status-format "#[fg=#8b949e] #I:#W "
set -g window-status-current-format "#[bg=#d29922,fg=#0d1117,bold] #I:#W "
set -g window-status-separator ""
set -g window-status-style "bg=#161b22,fg=#8b949e"
set -g window-status-current-style "bg=#d29922,fg=#0d1117,bold"
set -g message-style "bg=#8250df,fg=#f0f6fc,bold"
set -g mode-style "bg=#bb8009,fg=#f0f6fc,bold"

##### --- Plugin List --- #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-resurrect'

##### --- Initialize TPM --- #####
run '~/.tmux/plugins/tpm/tpm'
